<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Searches - iBuyCars</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .search-card {
            background: var(--bg-white);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .search-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .search-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .search-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .search-date {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .search-params {
            background: var(--bg-light);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .param-item {
            display: flex;
            justify-content: space-between;
            padding: 0.25rem 0;
            font-size: 0.9rem;
        }

        .param-label {
            color: var(--text-light);
        }

        .param-value {
            font-weight: 600;
            color: var(--text-dark);
        }

        .search-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .btn-run {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            flex: 1;
        }

        .btn-run:hover {
            transform: translateY(-2px);
        }

        .btn-assign {
            background: #2196F3;
            color: white;
            flex: 1;
        }

        .btn-assign:hover {
            background: #1976D2;
        }

        .btn-delete {
            background: #f44336;
            color: white;
        }

        .btn-delete:hover {
            background: #d32f2f;
        }

        .results-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 3000;
            overflow-y: auto;
        }

        .results-content {
            background: var(--bg-white);
            max-width: 1200px;
            margin: 2rem auto;
            border-radius: 12px;
            padding: 2rem;
            position: relative;
        }

        .close-results {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 2rem;
            cursor: pointer;
            color: var(--text-light);
        }

        .close-results:hover {
            color: var(--text-dark);
        }

        .assign-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            overflow-y: auto;
        }

        .assign-content {
            background: var(--bg-white);
            max-width: 600px;
            margin: 5rem auto;
            border-radius: 12px;
            padding: 2rem;
        }

        .user-select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="iBuyCars Logo">
                </div>
                <nav class="nav">
                    <a href="/" class="nav-link">Search</a>
                    <a href="/searches" class="nav-link active">Saved Searches</a>
                    <a href="/users" class="nav-link">Users</a>
                    <a href="/my-assignments" class="nav-link">My Assignments</a>
                    <a href="/logout" class="nav-link">Logout</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <section class="search-section">
        <div class="container">
            <h2 class="results-title">Saved Searches</h2>
            <p style="margin-bottom: 2rem; color: var(--text-light);">
                Run your saved searches and assign listings to team members
            </p>

            <div class="search-grid" id="searchesGrid">
                <div class="search-card">
                    <p style="text-align: center; padding: 2rem;">Loading saved searches...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Results Modal -->
    <div id="resultsModal" class="results-modal">
        <div class="results-content">
            <span class="close-results" onclick="closeResults()">&times;</span>
            <h3>Search Results</h3>
            <div id="resultsContainer"></div>
        </div>
    </div>

    <!-- Assignment Modal -->
    <div id="assignModal" class="assign-modal">
        <div class="assign-content">
            <h3>Assign Listing</h3>
            <p id="assignListingTitle" style="margin-bottom: 1rem;"></p>
            <label for="assignUser">Assign to:</label>
            <select id="assignUser" class="user-select">
                <option value="">Loading users...</option>
            </select>
            <div style="display: flex; gap: 1rem;">
                <button class="btn btn-assign" onclick="confirmAssignment()">Assign</button>
                <button class="btn btn-delete" onclick="closeAssignModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 iBuyCars. Search across multiple car listing websites.</p>
        </div>
    </footer>

    <script>
        let currentSearchResults = [];
        let currentAssignment = null;
        let allUsers = [];

        document.addEventListener('DOMContentLoaded', function () {
            loadSearches();
            loadUsers();
        });

        async function loadSearches() {
            try {
                const response = await fetch('/api/searches');
                const searches = await response.json();

                const grid = document.getElementById('searchesGrid');

                if (searches.length === 0) {
                    grid.innerHTML = `
                        <div class="search-card">
                            <p style="text-align: center; padding: 2rem;">
                                No saved searches yet. Run a search from the main page and save it!
                            </p>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = searches.map(search => `
                    <div class="search-card">
                        <div class="search-header">
                            <div>
                                <div class="search-name">${search.name}</div>
                                <div class="search-date">
                                    Created ${new Date(search.created_at).toLocaleDateString()}
                                </div>
                            </div>
                        </div>

                        <div class="search-params">
                            ${search.search_params.makes ? `
                                <div class="param-item">
                                    <span class="param-label">Makes:</span>
                                    <span class="param-value">${search.search_params.makes.join(', ')}</span>
                                </div>
                            ` : ''}
                            ${search.search_params.model ? `
                                <div class="param-item">
                                    <span class="param-label">Model:</span>
                                    <span class="param-value">${search.search_params.model}</span>
                                </div>
                            ` : ''}
                            ${search.search_params.location ? `
                                <div class="param-item">
                                    <span class="param-label">Location:</span>
                                    <span class="param-value">${search.search_params.location}</span>
                                </div>
                            ` : ''}
                            ${search.search_params.price_min || search.search_params.price_max ? `
                                <div class="param-item">
                                    <span class="param-label">Price:</span>
                                    <span class="param-value">
                                        $${search.search_params.price_min || '0'} - $${search.search_params.price_max || '∞'}
                                    </span>
                                </div>
                            ` : ''}
                        </div>

                        <div class="search-actions">
                            <button class="btn btn-run" onclick="runSearch(${search.id})">
                                Run Search
                            </button>
                            <button class="btn btn-delete" onclick="deleteSearch(${search.id})">
                                Delete
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading searches:', error);
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                allUsers = await response.json();

                const select = document.getElementById('assignUser');
                select.innerHTML = '<option value="">Select a user...</option>' +
                    allUsers.filter(u => u.is_active && u.role === 'user')
                        .map(u => `<option value="${u.id}">${u.name || u.email}</option>`)
                        .join('');
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        async function runSearch(searchId) {
            try {
                const response = await fetch(`/api/searches/${searchId}/results`, {
                    method: 'POST'
                });
                currentSearchResults = await response.json();

                // Display results in modal
                document.getElementById('resultsModal').style.display = 'block';
                displayResults(currentSearchResults, searchId);
            } catch (error) {
                console.error('Error running search:', error);
                alert('Error running search');
            }
        }

        function displayResults(results, searchId) {
            const container = document.getElementById('resultsContainer');

            if (results.length === 0) {
                container.innerHTML = '<p>No results found</p>';
                return;
            }

            container.innerHTML = `
                <div class="results-grid">
                    ${results.map(listing => `
                        <div class="car-card">
                            ${listing.image_url ? `
                                <div class="car-image">
                                    <img src="${listing.image_url}" alt="${listing.title}">
                                </div>
                            ` : '<div class="car-image">No Image</div>'}
                            <div class="car-content">
                                <h3 class="car-title">${listing.title}</h3>
                                <div class="car-price">${listing.price}</div>
                                <div class="car-details">
                                    <div class="car-detail-item">🌍 ${listing.location || 'Location not specified'}</div>
                                </div>
                                <div class="car-footer">
                                    <span class="source-badge ${listing.source.toLowerCase()}">${listing.source}</span>
                                    <button class="btn btn-assign" onclick="assignListing('${listing.url}', '${listing.title}', ${searchId})">
                                        Assign
                                    </button>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function closeResults() {
            document.getElementById('resultsModal').style.display = 'none';
        }

        function assignListing(url, title, searchId) {
            currentAssignment = {
                url: url,
                title: title,
                searchId: searchId,
                listing: currentSearchResults.find(r => r.url === url)
            };

            document.getElementById('assignListingTitle').textContent = title;
            document.getElementById('assignModal').style.display = 'block';
        }

        function closeAssignModal() {
            document.getElementById('assignModal').style.display = 'none';
            currentAssignment = null;
        }

        async function confirmAssignment() {
            const userId = document.getElementById('assignUser').value;

            if (!userId) {
                alert('Please select a user');
                return;
            }

            try {
                const response = await fetch('/api/assignments', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        search_id: currentAssignment.searchId,
                        listing_url: currentAssignment.url,
                        listing_data: currentAssignment.listing,
                        assigned_to: parseInt(userId)
                    })
                });

                if (response.ok) {
                    alert('Listing assigned successfully!');
                    closeAssignModal();
                } else {
                    alert('Failed to assign listing');
                }
            } catch (error) {
                console.error('Error assigning listing:', error);
                alert('Error assigning listing');
            }
        }

        async function deleteSearch(searchId) {
            if (!confirm('Are you sure you want to delete this search?')) {
                return;
            }

            try {
                const response = await fetch(`/api/searches/${searchId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    alert('Search deleted successfully!');
                    loadSearches();
                } else {
                    alert('Failed to delete search');
                }
            } catch (error) {
                console.error('Error deleting search:', error);
                alert('Error deleting search');
            }
        }
    </script>
</body>

</html>

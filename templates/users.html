<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - iBuyCars</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .user-table {
            width: 100%;
            background: var(--bg-white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        .user-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .user-table th {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 1rem;
            text-align: left;
            font-weight: 600;
        }

        .user-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .user-table tr:last-child td {
            border-bottom: none;
        }

        .user-table tr:hover {
            background: var(--bg-light);
        }

        .role-badge {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .role-badge.manager {
            background: var(--primary-color);
            color: white;
        }

        .role-badge.user {
            background: #e0e0e0;
            color: var(--text-dark);
        }

        .status-badge {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-badge.active {
            background: #4caf50;
            color: white;
        }

        .status-badge.inactive {
            background: #f44336;
            color: white;
        }

        .btn-action {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 0.5rem;
        }

        .btn-promote {
            background: var(--primary-color);
            color: white;
        }

        .btn-promote:hover {
            background: var(--primary-dark);
        }

        .btn-demote {
            background: #ff9800;
            color: white;
        }

        .btn-demote:hover {
            background: #f57c00;
        }

        .btn-deactivate {
            background: #f44336;
            color: white;
        }

        .btn-deactivate:hover {
            background: #d32f2f;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-white);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-top: 0.5rem;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="iBuyCars Logo">
                </div>
                <nav class="nav">
                    <a href="/" class="nav-link">Search</a>
                    <a href="/searches" class="nav-link">Saved Searches</a>
                    <a href="/users" class="nav-link active">Users</a>
                    <a href="/my-assignments" class="nav-link">My Assignments</a>
                    <a href="/logout" class="nav-link">Logout</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <section class="search-section">
        <div class="container">
            <h2 class="results-title">User Management</h2>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalUsers">0</div>
                    <div class="stat-label">Total Users</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalManagers">0</div>
                    <div class="stat-label">Managers</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="activeUsers">0</div>
                    <div class="stat-label">Active Users</div>
                </div>
            </div>

            <!-- Users Table -->
            <div class="user-table">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Last Login</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- Users will be loaded here -->
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 2rem;">
                                Loading users...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 iBuyCars. Search across multiple car listing websites.</p>
        </div>
    </footer>

    <script>
        // Load users on page load
        document.addEventListener('DOMContentLoaded', function () {
            loadUsers();
        });

        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                const users = await response.json();

                // Update stats
                document.getElementById('totalUsers').textContent = users.length;
                document.getElementById('totalManagers').textContent =
                    users.filter(u => u.role === 'manager').length;
                document.getElementById('activeUsers').textContent =
                    users.filter(u => u.is_active).length;

                // Populate table
                const tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = '';

                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2rem;">No users found</td></tr>';
                    return;
                }

                users.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${user.name || 'N/A'}</td>
                        <td>${user.email}</td>
                        <td><span class="role-badge ${user.role}">${user.role.toUpperCase()}</span></td>
                        <td><span class="status-badge ${user.is_active ? 'active' : 'inactive'}">${user.is_active ? 'Active' : 'Inactive'}</span></td>
                        <td>${user.last_login ? new Date(user.last_login).toLocaleDateString() : 'Never'}</td>
                        <td>
                            ${user.role === 'user' ?
                            `<button class="btn-action btn-promote" onclick="changeRole(${user.id}, 'manager')">Promote to Manager</button>` :
                            `<button class="btn-action btn-demote" onclick="changeRole(${user.id}, 'user')">Demote to User</button>`
                        }
                            ${user.is_active ?
                            `<button class="btn-action btn-deactivate" onclick="deactivateUser(${user.id})">Deactivate</button>` :
                            ''
                        }
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading users:', error);
                document.getElementById('usersTableBody').innerHTML =
                    '<tr><td colspan="6" style="text-align: center; padding: 2rem; color: red;">Error loading users</td></tr>';
            }
        }

        async function changeRole(userId, newRole) {
            if (!confirm(`Are you sure you want to change this user's role to ${newRole}?`)) {
                return;
            }

            try {
                const response = await fetch(`/api/users/${userId}/role`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ role: newRole })
                });

                if (response.ok) {
                    alert('Role updated successfully!');
                    loadUsers();
                } else {
                    alert('Failed to update role');
                }
            } catch (error) {
                console.error('Error updating role:', error);
                alert('Error updating role');
            }
        }

        async function deactivateUser(userId) {
            if (!confirm('Are you sure you want to deactivate this user?')) {
                return;
            }

            try {
                const response = await fetch(`/api/users/${userId}/deactivate`, {
                    method: 'PUT'
                });

                if (response.ok) {
                    alert('User deactivated successfully!');
                    loadUsers();
                } else {
                    alert('Failed to deactivate user');
                }
            } catch (error) {
                console.error('Error deactivating user:', error);
                alert('Error deactivating user');
            }
        }
    </script>
</body>

</html>
